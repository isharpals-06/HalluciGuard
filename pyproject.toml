[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "halluciguard-okf"
version = "1.0.0"
description = "Uncertainty-Aware Atomic Claim Verification and Hallucination Detection Framework with Selective Abstention"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "HalluciGuard Research Team" }
]
dependencies = [
    "torch==2.15.0",
    "transformers==5.22.1",
    "pydantic==2.14.2",
    "scikit-learn==1.9.1",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pyyaml==6.0.3",
    "pytest==9.2.0",
    "matplotlib==3.11.2",
    "safetensors==0.8.0",
    "requests==2.32.5",
    "numpy==2.4.6",
    "scipy==1.17.1"
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0"
]
cloud = ["requests>=2.31.0"]

[project.scripts]
halluciguard = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
